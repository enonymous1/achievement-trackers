name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stage only site files. Uploading the repo root would also
      # deploy .github/, tools/ and data/ — nothing secret, but no
      # visitor needs them, and a future accidental file would ship
      # too. Game directories are derived from data slugs, so adding
      # a game needs no workflow change.
      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp -r how-it-works _site/
          for d in data/*.json; do
            case "$d" in
              *schema.json) continue ;;
            esac
            slug=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['slug'])" "$d")
            cp -r "$slug" _site/
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
