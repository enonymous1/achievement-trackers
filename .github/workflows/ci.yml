name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated pages match the data
        run: python3 tools/generate.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Inline scripts pass node --check
        run: python3 tools/check_js.py
